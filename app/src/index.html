<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>getmymetro — Kochi Metro times</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kochi Metro departure times, fares and last-train warnings. Know when to leave, not just where the train is."
    />

    <!-- Lets the browser paint native scrollbars and form controls in the
         right theme before any CSS loads.

         Light only. The "the line" system is a single white-ground palette
         (getmymetro-design/DESIGN.md §2) with no dark counterpart specified,
         and declaring `light dark` here would have the browser paint dark
         scrollbars and dark form controls around a permanently white page. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Self-hosted fonts: no Google Fonts CDN anywhere. DESIGN.md §3 names
         Geist and `getmymetro-design/tokens.css` opens with a
         `fonts.googleapis.com` @import; the typeface is adopted, the delivery
         is not. A CDN would cost a DNS + TLS round trip on a patchy connection
         and would break the offline guarantee the service worker provides.

         Geist is SIL OFL 1.1, subset here to 28KB — smaller than the Noto Sans
         latin face it replaces. Only the Latin face is preloaded: the
         Malayalam face (89KB) is gated behind `unicode-range`, so an English
         reader never fetches it. -->
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- The mark is the JourneyLine (DESIGN.md §5.1): origin ring, the line,
         destination disc — white on --gmm-line-text. SVG for modern browsers,
         .ico (16/32/48) as the fallback. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The PWA the competitor advertises and does not ship: keralam.co's
         manifest has an empty name and there is no service worker behind it
         (CLAUDE.md finding 7). This one installs, and `public/sw.js`
         precaches the shell and the whole 7 kB network, so the app works with
         the network off. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Home-screen launch on iPhone: full screen, and the label under the icon. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GetMyMetro" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
